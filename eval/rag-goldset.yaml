# RAG 평가 골드셋 — 한빛 IDC SOP 코퍼스 대상 30건
# fictional: true — 실제 조직·설비와 무관한 포트폴리오 데모용 질의
goldset:
  - qid: Q01
    query: UPS가 배터리 모드로 넘어갔는데 다음에 뭘 확인해야 하나요?
    role: 전력담당
    gold_doc_id: SOP-PWR-001
    gold_section: "4.2"
    answer_key: UPS 출력 전압이 정격범위(±5% 이내)로 유지되는지 확인하고 GPU서버담당에게 부하측 순단 여부 교차 확인을 요청한다.

  - qid: Q02
    query: 정전 났는데 발전기가 자동으로 안 켜지면 어떻게 하나요?
    role: 전력담당
    gold_doc_id: SOP-PWR-001
    gold_section: "4.3"
    answer_key: 상용전원 정전이 30초 이상 지속되고도 자동기동이 안되면 현장에서 수동 기동 스위치를 조작하고 기동까지 소요된 시간을 기록한다.

  - qid: Q03
    query: 차단기가 트립됐을 때 재투입은 몇 번까지 시도할 수 있나요?
    role: 전력담당
    gold_doc_id: SOP-PWR-001
    gold_section: "7"
    answer_key: 재투입 실패한 차단기를 임의로 2회 이상 재시도하지 않는다. 절연저항 측정 후 이상이 없을 때 1회만 재투입을 시도한다.

  - qid: Q04
    query: 발전기로 전환된 후 UPS 배터리는 어떻게 처리하나요?
    role: 관제총괄
    gold_doc_id: SOP-PWR-001
    gold_section: "4.4"
    answer_key: UPS는 재충전 모드로 전환하고, 배터리 완전방전 방지를 위해 비필수 부하(사무동 조명 등)를 우선 차단한다.

  - qid: Q05
    query: 전력 계통 복구 후 GPU 랙 전원이 정상인지는 누가 확인하나요?
    role: GPU서버담당
    gold_doc_id: SOP-PWR-001
    gold_section: "4.6"
    answer_key: GPU서버담당이 각 GPU 랙 PDU의 입력 전압·전류를 확인해 전 랙 편차가 정격 대비 ±5% 이내인지 보고한다.

  - qid: Q06
    query: 전산실이 너무 더운데 뭐부터 확인해야 하나요?
    role: 시설안전담당
    gold_doc_id: SOP-THM-002
    gold_section: "4.1"
    answer_key: 알람이 발생한 존과 랙 위치를 특정하고 해당 존의 콜드아일 흡기온도와 핫아일 배기온도를 각각 확인한다.

  - qid: Q07
    query: 냉각기 한 대가 고장났을 때 예비 유닛은 언제 켜나요?
    role: 시설안전담당
    gold_doc_id: SOP-THM-002
    gold_section: "4.3"
    answer_key: 점검 결과 특정 유닛이 정지 또는 저효율 상태로 확인되면 동일 존을 커버하는 예비(N+1) 유닛을 즉시 수동 기동한다.

  - qid: Q08
    query: 15분이 지나도 온도가 안 떨어지면 어떻게 하나요?
    role: GPU서버담당
    gold_doc_id: SOP-THM-002
    gold_section: "4.5"
    answer_key: 흡기온도가 권장범위 상한(27°C)을 초과하면 시설안전담당은 GPU서버담당에게 해당 존 고부하 작업의 일시 축소를 요청한다.

  - qid: Q09
    query: 블랭킹 패널이 빠져 있으면 왜 문제가 되나요?
    role: 시설안전담당
    gold_doc_id: SOP-THM-002
    gold_section: "4.4"
    answer_key: 블랭킹 패널 누락 등은 콜드아일-핫아일 기류 혼합을 유발하는 원인이므로 발견 즉시 원상 복구해야 한다.

  - qid: Q10
    query: 냉각수 압력이 떨어졌을 때 전기설비 근처 작업은 혼자 해도 되나요?
    role: 시설안전담당
    gold_doc_id: SOP-THM-002
    gold_section: "7"
    answer_key: 냉각수 배관 누수가 의심되는 경우 전기설비 근접 작업을 시설안전담당 단독으로 수행하지 않고 전력담당과 동행한다.

  - qid: Q11
    query: GPU 온도 알람이 떴을 때 제일 먼저 무엇을 특정해야 하나요?
    role: GPU서버담당
    gold_doc_id: SOP-GPU-003
    gold_section: "4.1"
    answer_key: 알람이 발생한 랙 번호, 서버 호스트명, GPU 슬롯 번호를 특정하고 현재 온도값과 에러코드를 기록한다.

  - qid: Q12
    query: GPU가 스로틀링 걸렸는지는 어떻게 확인하나요?
    role: GPU서버담당
    gold_doc_id: SOP-GPU-003
    gold_section: "4.2"
    answer_key: 원격 콘솔로 접속해 GPU 클럭 속도가 정상 대비 저하되어 있는지와 팬 회전수가 정상 범위인지 확인한다.

  - qid: Q13
    query: 돌아가고 있는 학습 작업은 그냥 꺼도 되나요?
    role: GPU서버담당
    gold_doc_id: SOP-GPU-003
    gold_section: "4.4"
    answer_key: 체크포인트 저장을 확인하지 않고 강제 종료하지 않으며, 체크포인트 저장 완료 후 안전하게 중단해 스케줄러에서 제외한다.

  - qid: Q14
    query: 부품 교체하고 나서 바로 운영에 투입해도 되나요?
    role: GPU서버담당
    gold_doc_id: SOP-GPU-003
    gold_section: "4.6"
    answer_key: 재기동 후 저부하 테스트 작업을 30분간 실행해 GPU 온도가 80°C 미만으로 유지되고 클럭 저하가 없는지 확인한 뒤에만 재투입한다.

  - qid: Q15
    query: 옆 서버도 같이 확인해야 하나요?
    role: GPU서버담당
    gold_doc_id: SOP-GPU-003
    gold_section: "4.8"
    answer_key: 동일 랙 내 인접 서버 2대의 온도·에러로그를 추가로 확인해 동일 원인 노출 여부를 점검한다.

  - qid: Q16
    query: 인터넷이 끊겼는데 전체가 끊긴 건지 일부만 끊긴 건지 어떻게 아나요?
    role: 네트워크담당
    gold_doc_id: SOP-NET-004
    gold_section: "4.1"
    answer_key: 핑 테스트와 경로 추적으로 단절 범위(전체망/특정 존/특정 랙)와 영향받는 랙 목록을 확인한다.

  - qid: Q17
    query: 회선업체 쪽 문제일 때는 어떻게 신고하나요?
    role: 네트워크담당
    gold_doc_id: SOP-NET-004
    gold_section: "4.4"
    answer_key: 회선사업자에게 즉시 장애를 신고하고 접수번호를 기록하며 예상 복구시간을 통보받는다.

  - qid: Q18
    query: SFP 모듈이 고장난 것 같으면 어떻게 하나요?
    role: 네트워크담당
    gold_doc_id: SOP-NET-004
    gold_section: "4.5"
    answer_key: 현장에서 해당 포트를 점검하고 예비 모듈·케이블로 교체한 뒤 포트 링크상태가 정상(Up)으로 전환되는지 확인한다.

  - qid: Q19
    query: 예비 경로로 전환한 뒤 원래 경로로는 언제 돌리나요?
    role: 네트워크담당
    gold_doc_id: SOP-NET-004
    gold_section: "4.7"
    answer_key: 예비 경로로 24시간 이상 운영된 경우 원계통 정상 여부를 확인하고 트래픽이 낮은 시간대에 계획된 복귀 전환을 수행한다.

  - qid: Q20
    query: 경로를 바꾸고 나면 방화벽 설정도 확인해야 하나요?
    role: 네트워크담당
    gold_doc_id: SOP-NET-004
    gold_section: "4.8"
    answer_key: 방화벽 정책이 예비 장비에 동일하게 적용되어 있는지 확인하고 불일치가 있으면 즉시 동기화한다.

  - qid: Q21
    query: 장애 등급은 무엇을 기준으로 정하나요?
    role: 관제총괄
    gold_doc_id: SOP-ESC-005
    gold_section: "4.3"
    answer_key: 영향범위와 긴급도 매트릭스에 따라 P1(전체 서비스 중단, 즉시조치)부터 P4(개별 장비, 계획조치)까지 등급을 확정한다.

  - qid: Q22
    query: P1이면 누구한테까지 연락해야 하나요?
    role: 관제총괄
    gold_doc_id: SOP-ESC-005
    gold_section: "4.4"
    answer_key: 15분 이내에 전 담당역할(전력·GPU서버·네트워크·시설안전)과 시니어 관제총괄 상위 라인에 동시 통보하고 응답(ACK)을 확인한다.

  - qid: Q23
    query: P3나 P4는 바로 안 알려도 되나요?
    role: 관제총괄
    gold_doc_id: SOP-ESC-005
    gold_section: "4.6"
    answer_key: 즉시 에스컬레이션 없이 당일 또는 익일 정기 보고서에 편입하되, 담당자는 계획된 조치 일정을 등록한다.

  - qid: Q24
    query: 여러 계통이 동시에 터지면 등급을 어떻게 매기나요?
    role: 관제총괄
    gold_doc_id: SOP-ESC-005
    gold_section: "2"
    answer_key: 두 개 이상의 계통이 동시에 영향을 받는 복합장애의 경우 가장 높은 등급을 전체 사건의 등급으로 채택한다.

  - qid: Q25
    query: 장애가 1시간 넘게 안 풀리면 어떻게 하나요?
    role: 관제총괄
    gold_doc_id: SOP-ESC-005
    gold_section: "4.8"
    answer_key: P1이 1시간 이상 지속되거나 원인이 특정되지 않으면 시니어 관제총괄에게 상황을 브리핑하고 외부 지원인력 투입 여부를 결정받는다.

  - qid: Q26
    query: 교대할 때 인계 준비는 몇 분 전부터 하나요?
    role: 관제총괄
    gold_doc_id: SOP-SHF-006
    gold_section: "4.1"
    answer_key: 인계자는 교대 30분 전까지 진행 중인 모든 이슈를 등급·현재단계와 함께 근무일지에 정리한다.

  - qid: Q27
    query: 인계받은 내용은 어떻게 제대로 확인하나요?
    role: 관제총괄
    gold_doc_id: SOP-SHF-006
    gold_section: "4.2"
    answer_key: 인수자가 이해한 내용을 되짚어 설명(read-back)하여 인계자의 확인을 받는 방식으로 개별 인계한다.

  - qid: Q28
    query: 인수인계가 다 끝났다는 건 뭘로 확정하나요?
    role: 관제총괄
    gold_doc_id: SOP-SHF-006
    gold_section: "4.5"
    answer_key: 인수자가 근무일지 전체 항목을 검토한 후 전자 서명으로 인수 완료를 확정한다.

  - qid: Q29
    query: 야간에 있었던 자잘한 알람도 다음날 넘겨야 하나요?
    role: 관제총괄
    gold_doc_id: SOP-SHF-006
    gold_section: "4.7"
    answer_key: 야간 중 발생한 저강도(P3·P4) 알람까지 누락 없이 목록화해 전달하며, 주간조는 이를 바탕으로 우선순위를 재조정한다.

  - qid: Q30
    query: 인수인계가 부실해서 사고가 또 나면 어떻게 되나요?
    role: 관제총괄
    gold_doc_id: SOP-SHF-006
    gold_section: "6"
    answer_key: 인수인계 누락으로 인한 재발장애가 발생한 경우 해당 사례를 개선기록으로 별도 등록한다.
